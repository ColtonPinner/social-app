services:
  db:
    image: postgres:16-alpine
    container_name: social-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: social-app-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:4
    container_name: social-app-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social-app-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/social_app
      JWT_SECRET: replace-me-with-a-long-random-secret
      REDIS_URL: redis://redis:6379
      CF_IMAGES_ACCOUNT_ID: ${CF_IMAGES_ACCOUNT_ID:-}
      CF_IMAGES_API_TOKEN: ${CF_IMAGES_API_TOKEN:-}
      BACK4APP_SERVER_URL: ${BACK4APP_SERVER_URL:-https://parseapi.back4app.com}
      BACK4APP_APP_ID: ${BACK4APP_APP_ID:-}
      BACK4APP_REST_API_KEY: ${BACK4APP_REST_API_KEY:-}
      BACK4APP_MASTER_KEY: ${BACK4APP_MASTER_KEY:-}
      BACK4APP_JAVASCRIPT_KEY: ${BACK4APP_JAVASCRIPT_KEY:-}
      BACK4APP_TIMEOUT_MS: ${BACK4APP_TIMEOUT_MS:-15000}
    command: >
      sh -c "
      psql \"$$DATABASE_URL\" -f sql/schema.sql &&
      yarn dev
      "
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

volumes:
  pg_data:
  redis_data:
  backend_node_modules:
